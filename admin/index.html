<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Dashboard — Sentinel Fortune LLC Shop Admin</title>
<meta name="robots" content="noindex,nofollow"/>
<meta name="theme-color" content="#04060f"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;500&family=Jost:wght@200;300;400&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="admin.css"/>
</head>
<body data-page="dashboard">
<div class="admin-app" style="display:flex;width:100%">
  <aside class="admin-sidebar">
    <div class="admin-logo">SENTINEL FORTUNE LLC<small>Shop Owner Admin</small></div>
    <nav class="admin-nav">
      <a href="index.html" aria-current="page">Dashboard</a>
      <a href="products.html">Products</a>
      <a href="orders.html">Orders</a>
      <a href="licenses.html">Licenses</a>
      <a href="files.html">Files</a>
      <a href="settings.html">Settings</a>
    </nav>
    <div class="admin-sidebar-foot">
      <div class="admin-whoami" id="whoami">—</div>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-head">
      <div>
        <div class="admin-title">Dashboard</div>
        <div class="admin-sub">Sentinel Fortune LLC — Digital Shop</div>
      </div>
    </div>

    <div class="stat-row">
      <div class="stat-card"><div class="stat-label">Shop Worker</div><div class="stat-value" id="healthStat">…</div></div>
      <div class="stat-card"><div class="stat-label">Products</div><div class="stat-value" id="productsStat">…</div></div>
      <div class="stat-card"><div class="stat-label">Orders</div><div class="stat-value" id="ordersStat">…</div></div>
      <div class="stat-card"><div class="stat-label">Licenses</div><div class="stat-value" id="licensesStat">…</div></div>
    </div>

    <div class="panel">
      <h2>Recent Admin Activity</h2>
      <table class="data-table">
        <thead><tr><th>When</th><th>Actor</th><th>Action</th><th>Target</th></tr></thead>
        <tbody id="auditLog"><tr class="empty-row"><td colspan="4">Loading…</td></tr></tbody>
      </table>
    </div>
  </main>
</div>

<script src="admin-config.js"></script>
<script src="admin.js"></script>
</body>
</html>
