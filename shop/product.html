<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Product — Sentinel Fortune LLC Digital Shop</title>
<!-- These are the static fallbacks. product.js rewrites title, description,
     og:* and canonical from the fetched product once it loads. A crawler that
     does not run JavaScript sees this generic version; the catalogue page is
     the static, crawlable entry point into the shop. -->
<meta name="description" content="A digital product from Sentinel Fortune LLC. One-time purchase, licensed download, secure Stripe checkout."/>
<meta name="robots" content="index,follow"/>
<link rel="canonical" href="https://sentinelfortune.github.io/sentinelfortune/shop/product.html"/>
<meta property="og:type" content="product"/>
<meta property="og:site_name" content="Sentinel Fortune LLC"/>
<meta property="og:title" content="Digital product — Sentinel Fortune LLC"/>
<meta property="og:description" content="A digital product from Sentinel Fortune LLC. One-time purchase, licensed download, secure Stripe checkout."/>
<meta property="og:image" content="https://sentinelfortune.github.io/sentinelfortune/assets/img/sf-og.jpg"/>
<meta name="twitter:card" content="summary_large_image"/>
<meta name="theme-color" content="#04060f"/>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32.png"/>
<link rel="apple-touch-icon" sizes="180x180" href="../assets/img/favicon-180.png"/>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;500&family=Jost:wght@200;300;400&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="shop.css"/>
</head>
<body>

<header class="shop-hdr">
  <div class="shop-hdr-inner">
    <a class="shop-logo" href="../index.html">SENTINEL FORTUNE LLC<small>Digital Shop</small></a>
    <nav class="shop-hdr-nav">
      <a href="index.html">Catalog</a>
      <a href="../products/">Products</a>
      <a href="licenses.html">Licenses</a>
      <a href="refund-policy.html">Refund Policy</a>
      <a href="terms-of-sale.html">Terms</a>
      <a href="privacy.html">Privacy</a>
      <a href="contact.html">Contact</a>
    </nav>
    <a class="shop-hdr-back" href="index.html">← Catalog</a>
  </div>
</header>

<main>
  <div id="productRoot" style="padding-top:48px">
    <!-- A real <h1> before JavaScript runs. render() replaces this whole
         subtree with the product's own <h1>, so there is exactly one at every
         point in the page's life — including for a crawler that never
         executes the script. -->
    <h1 class="sr-only">Digital product — Sentinel Fortune LLC</h1>
    <div class="spinner" role="status" aria-label="Loading product"></div>
  </div>
</main>

<footer class="shop-ftr">
  <nav class="shop-ftr-links">
    <a href="index.html">Catalog</a>
    <a href="../products/">Products</a>
    <a href="licenses.html">Licenses</a>
    <a href="refund-policy.html">Refund Policy</a>
    <a href="terms-of-sale.html">Terms of Sale</a>
    <a href="privacy.html">Privacy</a>
    <a href="contact.html">Contact</a>
    <a href="../index.html">Sentinel Fortune LLC — Main Site</a>
  </nav>
  <div class="shop-ftr-copy">© Sentinel Fortune LLC. All rights reserved.</div>
</footer>

<script src="shop-config.js"></script>
<script src="product.js"></script>
</body>
</html>
