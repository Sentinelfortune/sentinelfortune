# The five public product universes.
#
# Single source of truth. The homepage, the /products/ page and the shop
# catalogue filter all read from this file, so adding a sixth universe later
# is one entry here rather than an edit in three places.
#
# `category` is the value matched against the Shop Worker's `category` column
# on each product. It is the contract between this file and the catalogue —
# a product whose category does not match one of these five falls into the
# catalogue's "All products" view and nowhere else, which is a visible,
# recoverable failure rather than a silent one.
#
# `examples` describe the KINDS of thing a universe holds. They are not claims
# that such a product exists today. The catalogue is the only authority on
# what is actually for sale.

- slug: business
  category: Business & Professional
  title: Business & Professional
  image: /assets/img/universes/business.svg
  image_alt: Layered documents above a rising measure, drawn in gold on navy
  blurb: >-
    Operational material for people who run the business day to day: the
    checklists, templates and decision structures that keep work repeatable
    when the person who invented the process is busy.
  examples:
    - Business toolkits
    - Workbooks and templates
    - AI operations resources
    - Productivity systems
    - Professional digital tools

- slug: education
  category: Education & Learning
  title: Education & Learning
  image: /assets/img/universes/education.svg
  image_alt: An open book beneath an arc of marked progress, drawn in gold on navy
  blurb: >-
    Structured material for learning something properly rather than skimming
    it — sequenced, with exercises that have answers and a defined finish
    line.
  examples:
    - Study materials
    - Educational guides
    - Courses and masterclasses
    - Exam preparation
    - Exercises with worked corrections
    - Learning workbooks

- slug: books
  category: Books & Publishing
  title: Books & Publishing
  image: /assets/img/universes/books.svg
  image_alt: A fan of bound spines, drawn in gold on navy
  blurb: >-
