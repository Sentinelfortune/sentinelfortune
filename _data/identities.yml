# The seven specialized identities of Sentinel Fortune LLC.
#
# One company, one ecosystem, one master domain. Each identity is a house
# within it, not a separate business.
#
# DO NOT CONFUSE THIS FILE WITH _data/universes.yml. That file holds the FIVE
# product universes, which are the Digital Shop's catalogue taxonomy. This file
# holds the SEVEN identities, which are brand houses. They are different
# things with different jobs and they are deliberately kept apart.
#
# ---------------------------------------------------------------------------
# OWNERSHIP IS BY PROBLEM DOMAIN, NEVER BY TECHNOLOGY FORMAT
# ---------------------------------------------------------------------------
# A product belongs to the identity that owns its PRIMARY CUSTOMER PROBLEM.
#
#     primary customer problem  ->  primary identity        (correct)
#     technology format         ->  identity                (WRONG)
#
# A mini-SaaS is not automatically LightNode's because it is software, any
# more than a PDF is automatically Books & Publishing's because it is a file.
# LightNode owns products whose primary problem IS the technology: AI systems,
# automation, agents, workflows, infrastructure, operational tooling. A costing
# calculator solves a business problem and belongs to the business-domain
# identity even though it happens to be code.
#
# `domain.owns` below is the test. Ask what the customer's problem is, then
# find the identity that lists it.
#
# ---------------------------------------------------------------------------
# PRIMARY EXPERIENCE IS A DIFFERENTIATOR, NOT A CEILING
# ---------------------------------------------------------------------------
# `experience` names the ONE interaction that makes this identity feel unlike
# the other six. It exists so the seven are not seven copies of one website.
#
# It does not define the limit of the identity. `capabilities` lists the
# approved surface the identity may grow into inside its problem domain.
# Something in `capabilities` is permitted, not promised, and not built.
#
# ---------------------------------------------------------------------------
# READINESS IS THREE INDEPENDENT DIMENSIONS, NOT ONE BOOLEAN
# ---------------------------------------------------------------------------
#   experienceReady  the experience is built AND validated (G1+G2+G3 pass)
#   hubVisible       the Public Hub may link to /identities/<slug>/
#   subdomainLive    <slug>.sentinelfortune.com is actually serving
#
# They are strictly nested. Each one requires the one above it:
#
#     subdomainLive  =>  hubVisible  =>  experienceReady
#
# _includes/identity-card.html enforces that nesting at render time, so a
# careless edit here cannot produce a link to a page that is not ready or an
# address that does not resolve. Raising a flag out of order is ignored, and
# the identity renders one step down.
#
# ONLY THE OWNER RAISES A FLAG. `subdomainLive` additionally requires DNS that
# does not exist today: as of this writing NONE of the seven subdomains is
# registered, configured or serving, so `subdomainLive` is false everywhere and
# nothing in this repository may link to those addresses.
#
# `gates` records WHY each identity sits where it does. It is evidence, not
# decoration — the note is what a later reader needs to re-check the claim.

- slug: sentinelfortunerecords
  title: Sentinel Fortune Records
  tag: Sound
  icon: "♪"
  addr: sentinelfortunerecords.sentinelfortune.com
  blurb: >-
    Releases, sound worlds, artists, sonic identity, and immersive audio.
  domain:
    owns:
      - recorded sound and releases
      - sonic identity and brand audio
      - artist development and artist tooling
      - audio project and launch operations
  experience:
    model: listening-room
    primitive: the sound source
    verb: listen
    differentiator: >-
      Continuous playback with a transport that persists while you browse. The
      page is an instrument you operate, not a document you read.
  capabilities:
    - listening
    - release planning
    - artist tools
    - audio projects
    - launch operations
  never_claims:
    - signed artists or a roster
    - presence on streaming platforms
    - release dates, chart positions or play counts
    - recordings that do not exist
  readiness:
    experienceReady: false
    hubVisible: false
    subdomainLive: false
  gates:
    substance: fail
    substance_note: >-
      No recorded audio exists. data/broadcast.json holds an empty episodes
      array. The homepage's Origin Echo is generated live by the Web Audio API
      and is honestly labelled as generated, not as a recording.
    distinctness: pass
    validation: pending

